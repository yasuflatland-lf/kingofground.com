name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      maintenance_window:
        description: "メンテナンス中画面を配信する（true）か、本サイトを配信する（false）か"
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # メンテナンス中画面を配信するかどうかの既定値。main への push ではこの値が使われる。
  # 本サイトを公開するときは 'true' を 'false' にしてマージする。
  # workflow_dispatch で手動実行したときは入力値がこの既定値を上書きする（次の push で既定値に戻る）。
  MAINTENANCE_WINDOW: ${{ github.event.inputs.maintenance_window || 'true' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v6
      - name: Build maintenance page
        if: env.MAINTENANCE_WINDOW == 'true'
        run: pnpm build:maintenance
      - name: Build site
        if: env.MAINTENANCE_WINDOW != 'true'
        run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
